name: DataExodus validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -c requirements-tested.txt
      - name: Python tests
        run: python -m pytest tests/ -q
      - name: Raspberry Pi installer and firewall syntax
        run: |
          bash -n pi/install.sh
          bash -n pi/hotspot.sh
          sudo apt-get install -y nftables
          sed "s|@UID@|1001|" pi/nftables-dataexodus.nft > "$RUNNER_TEMP/dataexodus.nft"
          sudo nft -c -f "$RUNNER_TEMP/dataexodus.nft"
      - name: Generate controlled fixture report
        run: python -m analysis.demo
      - name: Install optional UI test dependency
        run: npm install --prefix "$RUNNER_TEMP/dataexodus-ui" jsdom --no-audit --no-fund
      - name: Extension, crawler hook and report DOM tests
        env:
          NODE_PATH: ${{ runner.temp }}/dataexodus-ui/node_modules
        run: node --test tests/*.cjs
